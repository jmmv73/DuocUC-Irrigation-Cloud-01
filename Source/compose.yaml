name: smart-irrigation-http
services:
  broker:
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./generated/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt_data:/mosquitto/data
    networks: [iot]

  mongo:
    image: mongo:8.0
    restart: unless-stopped
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' | grep -q 1"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 40s
    networks: [iot]

  dashboard:
    build: ./app
    restart: unless-stopped
    init: true
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"
    environment:
      DEVICE_CONFIG: /app/config/settings.json
      MQTT_HOST: broker
      MQTT_PORT: 1883
      MONGO_HOST: mongo
    volumes:
      - ./config/settings.json:/app/config/settings.json:ro
    depends_on:
      broker:
        condition: service_started
      mongo:
        condition: service_healthy
    networks: [iot]

networks:
  iot:
    driver: bridge

volumes:
  mongo_data:
  mqtt_data:
